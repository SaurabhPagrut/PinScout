name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # one line per test file; a failure prints its failing checks (full logs are uploaded when CI fails)
      - name: Lint and tests (scripts/lint.mjs, then tests/run.js)
        run: npm test
      - name: Manifest in step with stores.json
        run: |
          out=$(python3 tools/sync_manifest.py)
          echo "$out"
          if echo "$out" | grep -q WARNING; then echo "::error::sync_manifest.py warned (see above)"; exit 1; fi
          git diff --exit-code extension/manifest.json || { echo "::error::extension/manifest.json is out of date: run python3 tools/sync_manifest.py and commit"; exit 1; }
      - name: Build every browser
        run: npm run build
      - name: Lint the Firefox package
        run: npm run lint:firefox
      - name: Build the website
        run: npm run site
      - uses: actions/upload-artifact@v7
        with:
          name: pinscout-extension
          path: |
            dist/*/pinscout-*.zip
            dist/README.md
          retention-days: 1
      - uses: actions/upload-artifact@v7
        with:
          name: pinscout-site
          path: dist/site/
          retention-days: 1
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-logs
          path: .check/*.log
          retention-days: 1
